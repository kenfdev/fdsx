name: Linear Basic
description: >
  Simple 3-step linear workflow: Plan -> Implement -> Review.
  Uses profile-based provider references for provider-agnostic execution.
version: "1.0"
start_at: plan

states:
  plan:
    type: task
    profile: planner
    prompt_file: plan-prompt.txt
    result_path: $.plan
    timeout_seconds: 120
    retry: 2
    next: implement

  implement:
    type: task
    profile: coder
    prompt_file: implement-prompt.txt
    result_path: $.implementation
    timeout_seconds: 300
    retry: 2
    next: review

  review:
    type: task
    profile: reviewer
    prompt_file: review-prompt.txt
    result_path: $.review
    timeout_seconds: 180
    retry: 2
    next: done

  done:
    type: pass
    end: true
