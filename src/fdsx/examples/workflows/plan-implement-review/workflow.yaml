name: Plan-Implement-Review Loop
description: >
  Full-featured example: Plan (Claude) -> Implement (opencode) ->
  Parallel Review (Codex x2: implementation + security) -> Aggregate ->
  Choice -> Wait (human approval) -> System command.
  Demonstrates all fdsx state types and features.
version: "1.0"
start_at: plan
max_loop: 3

# Profile definitions allow provider/model to be referenced by name instead of
# inline. Both styles (profile reference and inline provider/model) may coexist.
profiles:
  smarty:
    provider: claude
    model: claude-sonnet-4-6
  specialist:
    provider: codex
    model: gpt-5.4
  doer:
    provider: opencode
    model: opencode-go/minimax-m2.5

states:
  # ──────────────────────────────────────────────
  # Step 1: Planning with Claude (profile reference)
  # ──────────────────────────────────────────────
  plan:
    type: task
    profile: smarty
    prompt_template: |
      You are a planning agent. Break down the following task into clear,
      actionable implementation steps. Be specific about which files to
      create, what functions to implement, and what types to define.

      Task: {task}
    result_path: $.plan
    timeout_seconds: 120
    retry: 2
    next: implement

  # ──────────────────────────────────────────────
  # Step 2: Implementation with opencode
  # ──────────────────────────────────────────────
  implement:
    type: task
    profile: doer
    prompt_template: |
      You are an implementation agent. Follow this plan exactly and write the code.
      Output ALL files with their full paths and content.

      Plan:
      {plan}

      Previous review feedback (if any):
      {review_feedback}
    result_path: $.implementation
    timeout_seconds: 300
    retry: 2
    next: parallel_review

  # ──────────────────────────────────────────────
  # Step 3: Parallel Review (2 branches, profile references)
  # ──────────────────────────────────────────────
  parallel_review:
    type: parallel
    branches:
      # Branch 1: Implementation quality review
      - profile: specialist
        prompt_template: |
          You are a code review agent focused on implementation quality.
          Check for correctness, best practices, and completeness.

          Plan:
          {plan}

          Implementation:
          {implementation}

          End with APPROVED or REJECTED: <reason>
        extract:
          strategy: [keyword, regex]
          pattern: "APPROVED|REJECTED"
          fallback:
            type: llm_classify
            provider: claude
            prompt: "Is this review APPROVED or REJECTED? One word: {output}"
          result_path: $.status
        timeout_seconds: 180
        retry: 2

      # Branch 2: Security review
      - profile: specialist
        prompt_template: |
          You are a security review agent. Check for input validation,
          injection risks, XSS, error handling leaks, and auth concerns.

          Implementation:
          {implementation}

          End with APPROVED or REJECTED: <reason>
        extract:
          strategy: [keyword, regex]
          pattern: "APPROVED|REJECTED"
          fallback:
            type: llm_classify
            provider: claude
            prompt: "Is this security review APPROVED or REJECTED? One word: {output}"
          result_path: $.status
        timeout_seconds: 180
        retry: 2

    result_path: $.reviews
    min_success: 2
    next: aggregate_reviews

  # ──────────────────────────────────────────────
  # Step 4: Aggregate review results
  # ──────────────────────────────────────────────
  aggregate_reviews:
    type: pass
    aggregate:
      source: $.reviews
      field: status
      strategy: all
      match: "APPROVED"
      no_match: "REJECTED"
      result_path: $.decision
    next: check_decision

  # ──────────────────────────────────────────────
  # Step 5: Branch on review decision
  # ──────────────────────────────────────────────
  check_decision:
    type: choice
    choices:
      - variable: $.decision
        operator: equals
        value: "APPROVED"
        next: approval_gate
    default: collect_feedback

  # ──────────────────────────────────────────────
  # Step 5b: Collect review feedback on rejection
  # ──────────────────────────────────────────────
  collect_feedback:
    type: pass
    parameters:
      review_feedback: "{reviews}"
    next: implement

  # ──────────────────────────────────────────────
  # Step 6: Human approval gate
  # ──────────────────────────────────────────────
  approval_gate:
    type: wait
    mode: prompt
    message: |
      ===== Review Complete =====
      Decision: {decision}

      Review details:
      {reviews}

      Do you approve this implementation?
    choices: [approve, reject, retry]
    result_path: $.approval
    notify:
      webhook:
        url: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
        template: "Workflow review {decision} - awaiting human approval"
    next: check_approval

  # ──────────────────────────────────────────────
  # Step 7: Branch on human approval
  # ──────────────────────────────────────────────
  check_approval:
    type: choice
    choices:
      - variable: $.approval
        operator: equals
        value: "approve"
        next: finalize
      - variable: $.approval
        operator: equals
        value: "retry"
        next: implement
    default: rejected_end

  # ──────────────────────────────────────────────
  # Step 8: Finalize
  # ──────────────────────────────────────────────
  finalize:
    type: task
    provider: system
    command: "echo 'Workflow complete! Implementation approved.'"
    result_path: $.final_message
    next: done

  # ──────────────────────────────────────────────
  # Terminal states
  # ──────────────────────────────────────────────
  done:
    type: pass
    end: true

  rejected_end:
    type: task
    provider: system
    command: "echo 'Workflow ended: rejected by human reviewer.'"
    result_path: $.rejection_message
    end: true
