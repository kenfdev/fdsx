name: Pass Wait Map Workflow
start_at: start
states:
  start:
    type: task
    provider: system
    command: echo start
    result_path: $.result
  pass:
    type: pass
    parameters:
      key: value
    next: wait
  wait:
    type: wait
    mode: prompt
    result_path: $.result
    next: map
  map:
    type: map
    items_path: $.items
    iterator:
      states:
        - name: item
          provider: system
          command: echo item
          result_path: $.item
    result_path: $.result
    end: true
