name: Parallel Workflow
start_at: start
states:
  start:
    type: task
    provider: system
    command: echo start
    result_path: $.result
  parallel:
    type: parallel
    branches:
      - provider: system
        command: echo branch1
        result_path: $.branch1
      - provider: system
        command: echo branch2
        result_path: $.branch2
    result_path: $.result
    next: end
  end:
    type: task
    provider: system
    command: echo end
    result_path: $.result
    end: true
