# Run: uv run fdsx run examples/session_fork_smoke.yaml
# Requires Pi >= 0.85.1 and access to the model below. Makes 3 model calls.
# Expected: seed = ORCHID, change = ORCHID:MAPLE, sibling = ORCHID.
# No result variables are inserted into prompts: recall must come from the fork.
name: session-fork-smoke
description: Check inherited conversation and isolation between sibling Pi forks
start_at: seed
retry_escalation: false
extraction_fallback: false

profiles:
  smoke:
    provider: pi
    model: openai-codex/gpt-5.6-luna
    disable_tools: true

states:
  seed:
    type: task
    profile: smoke
    retry: 0
    prompt_template: >-
      This is a conversation memory test. The current password is ORCHID.
      Remember it for later turns. Reply with only the current password.
    result_path: $.seed_reply
    next: change

  change:
    type: task
    profile: smoke
    retry: 0
    fork_from: seed
    prompt_template: >-
      Recall the current password from our conversation.
      Now change the current password to MAPLE and remember the change.
      Reply with only OLD:NEW, replacing OLD with the previous password
      and NEW with the new password. Do not use spaces or Markdown.
      If you cannot recall the previous password, use UNKNOWN for OLD.
    result_path: $.change_reply
    next: sibling

  sibling:
    type: task
    profile: smoke
    retry: 0
    fork_from: seed
    prompt_template: >-
      What is the current password from our conversation?
      Reply with only the password, without spaces or Markdown.
      If you cannot recall it, reply UNKNOWN. Do not guess.
    result_path: $.sibling_reply
    next: check_change

  check_change:
    type: choice
    choices:
      - variable: $.change_reply
        operator: equals
        value: "ORCHID:MAPLE"
        next: check_sibling
    default: failed

  check_sibling:
    type: choice
    choices:
      - variable: $.sibling_reply
        operator: equals
        value: ORCHID
        next: passed
    default: failed

  passed:
    type: task
    provider: system
    command: "echo 'PASS: both forks recalled the source; the sibling did not inherit the change.'"
    end: true

  failed:
    type: fail
    error: SessionForkSmokeFailed
    cause: "Expected change=ORCHID:MAPLE and sibling=ORCHID. Check task outputs; formatting differences also fail this check."
