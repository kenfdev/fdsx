name: full-impl
description: Full pipeline — plan → implement → parallel review (code quality, security) → replan (Claude, routes by complexity) → fix-simple (minimax, escalates to fix-complex on failure) / fix-complex (Sonnet) → finalize with PR creation
max_movements: 25
initial_movement: plan

piece_config:
  provider_options:
    codex: { network_access: true }
    opencode: { network_access: true }
    claude: { sandbox: { allow_unsandboxed_commands: true } }

# --- Section Maps ---

personas:
  planner: ../facets/personas/planner.md
  coder: ../facets/personas/coder.md
  code-quality-reviewer: ../facets/personas/code-quality-reviewer.md
  security-reviewer: ../facets/personas/security-reviewer.md
  performance-reviewer: ../facets/personas/performance-reviewer.md
  finalizer: ../facets/personas/finalizer.md

instructions:
  plan: ../facets/instructions/plan.md
  implement: ../facets/instructions/implement.md
  review-code-quality: ../facets/instructions/review-code-quality.md
  review-security: ../facets/instructions/review-security.md
  review-performance: ../facets/instructions/review-performance.md
  replan: ../facets/instructions/replan.md
  fix: ../facets/instructions/fix.md
  finalize: ../facets/instructions/finalize.md

report_formats:
  plan: ../facets/output-contracts/plan-report.md
  implementation: ../facets/output-contracts/implementation-report.md
  replan: ../facets/output-contracts/replan-report.md

# --- Movements ---

movements:
  # 1. Planning (Claude)
  - name: plan
    persona: planner
    instruction: plan
    edit: false
    provider: claude
    output_contracts:
      report:
        - name: plan.md
          format: plan
    rules:
      - condition: "Plan is ready"
        next: implement
      - condition: "Blocked — unresolved questions"
        next: ABORT
        requires_user_input: true
        appendix: |
          The planner has identified blockers.
          Please provide clarification and re-run.

  # 2. Implementation (OpenCode / opencode-go/minimax-m2.7)
  - name: implement
    persona: coder
    instruction: implement
    edit: true
    required_permission_mode: edit
#    provider: opencode
#    model: opencode-go/minimax-m2.7
    provider: claude
    model: claude-sonnet-4-6
    output_contracts:
      report:
        - name: implementation.md
          format: implementation
    rules:
      - condition: "Implementation complete"
        next: review
      - condition: "Unrecoverable error"
        next: ABORT

  # 3. Parallel Review (Codex / gpt-5.4, reasoning_effort=high from ~/.codex/config.toml)
  - name: review
    parallel:
      - name: code-quality
        persona: code-quality-reviewer
        instruction: review-code-quality
        edit: false
#        provider: codex
#        model: gpt-5.4
        provider: claude
        model: claude-opus-4-6
        rules:
          - condition: approved
          - condition: needs_fix

      - name: security
        persona: security-reviewer
        instruction: review-security
        edit: false
#        provider: codex
#        model: gpt-5.4
        provider: claude
        model: claude-opus-4-6
        rules:
          - condition: approved
          - condition: needs_fix

    rules:
      - condition: all("approved")
        next: finalize
      - condition: any("needs_fix")
        next: replan

  # 4. Replan (Claude — analyze review feedback, classify complexity, route to fix agent)
  - name: replan
    persona: planner
    instruction: replan
    edit: false
    provider: claude
    output_contracts:
      report:
        - name: replan.md
          format: replan
    rules:
      - condition: "Simple fixes only — route to cheap model"
        next: fix-simple
      - condition: "Complex fixes present — route to capable model"
        next: fix-complex
      - condition: "Blocked — fundamental design issues"
        next: ABORT
        requires_user_input: true
        appendix: |
          The replanner found fundamental design issues that require major rework.
          Please review the feedback and re-run with updated guidance.

  # 5a. Fix — simple (minimax, cheap)
  - name: fix-simple
    persona: coder
    instruction: fix
    edit: true
    required_permission_mode: edit
#    provider: opencode
#    model: opencode-go/minimax-m2.7
    provider: claude
    model: claude-sonnet-4-6
    rules:
      - condition: "Fixes applied successfully"
        next: review
      - condition: "Fixes attempted but build or tests fail"
        next: review
      - condition: "Cannot fix — beyond capability"
        next: fix-complex
      - condition: "Agent produced no output or an unrecognizable response"
        next: fix-complex

  # 5b. Fix — complex (Sonnet, capable)
  - name: fix-complex
    persona: coder
    instruction: fix
    edit: true
    required_permission_mode: edit
    provider: claude
    model: sonnet
    rules:
      - condition: "Fixes applied successfully"
        next: review
      - condition: "Fixes attempted but build or tests fail"
        next: review
      - condition: "Cannot fix — fundamental issues"
        next: ABORT
        requires_user_input: true
        appendix: |
          The fix agent could not resolve the issues even with the capable model.
          Please review the fix report and provide guidance.

  # 6. Finalize (Claude — commit → push → PR)
  - name: finalize
    persona: finalizer
    instruction: finalize
    edit: true
    required_permission_mode: full
    provider: claude
    quality_gates:
      - "All changes are committed (git status shows clean working tree)"
      - "Branch is pushed to remote"
      - "Pull request is created and URL is included in output"
    rules:
      - condition: "PR created successfully"
        next: COMPLETE
      - condition: "Error during finalization"
        next: ABORT

# --- Loop Monitors ---

loop_monitors:
  - cycle: [review, replan, fix-simple]
    threshold: 2
    judge:
      persona: planner
      instruction: |
        The review ↔ fix-simple (cheap model) loop has repeated {cycle_count} times.

        Read the latest review report and fix output. Evaluate:
        1. Did the most recent fix resolve all blocking findings?
        2. Has the cheap fix agent been making progress or repeating the same mistakes?
        3. Are the remaining findings (if any) beyond what a simple model can handle?

        Choose one:
        - If all blocking findings are resolved → proceed to review for final verification
        - If making progress and remaining issues are simple → continue with cheap model
        - If the cheap model is struggling with complexity → escalate to capable model
        - If fundamentally unfixable → abort
      rules:
        - condition: "All blocking findings resolved — verify with review"
          next: review
        - condition: "Making progress, continue with cheap model"
          next: fix-simple
        - condition: "Needs stronger model — escalate"
          next: fix-complex
        - condition: "Fundamentally unfixable — abort"
          next: ABORT
        - condition: "Code-quality approved, only non-actionable findings remain — skip to finalize"
          next: finalize

  - cycle: [review, replan, fix-complex]
    threshold: 2
    judge:
      persona: planner
      instruction: |
        The review ↔ fix-complex (capable model) loop has repeated {cycle_count} times.

        Read the latest review report and fix output. Evaluate:
        1. Did the most recent fix resolve all blocking findings?
        2. Has the fix agent been making partial progress or repeating the same mistakes?

        Choose one:
        - If all blocking findings are resolved → proceed to review for final verification
        - If making clear progress and remaining issues are straightforward → continue
        - If stalled with no meaningful code improvement → abort
      rules:
        - condition: "All blocking findings resolved — verify with review"
          next: review
        - condition: "Clear progress, fixable in one more iteration"
          next: fix-complex
        - condition: "Stalled or too complex to converge"
          next: ABORT
        - condition: "Code-quality approved, only non-actionable findings remain — skip to finalize"
          next: finalize
