name: Loop Test Flow
description: Loop test flow for testing max_loop behavior
start_at: plan
max_loop: 3

states:
  plan:
    type: task
    provider: system
    command: echo "Planning step"
    result_path: $.plan_output
    next: implement

  implement:
    type: task
    provider: system
    command: echo "Implementation step"
    result_path: $.impl_output
    next: review

  review:
    type: task
    provider: system
    command: echo "REJECTED"
    result_path: $.review_output
    next: decide

  decide:
    type: choice
    choices:
      - variable: $.review_output
        operator: equals
        value: "APPROVED"
        next: done
    default: plan

  done:
    type: task
    provider: system
    command: echo "Flow completed"
    result_path: $.final_result
    end: true
