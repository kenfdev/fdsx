name: Batch Task Execution Flow
description: Batch task execution flow for testing
start_at: plan
version: '1.0'

states:
  plan:
    type: task
    provider: system
    command: "echo 'Planning for task: $task'"
    result_path: $.plan
    next: implement

  implement:
    type: task
    provider: system
    command: "echo 'Implementation for task: $task'"
    result_path: $.implementation
    end: true
