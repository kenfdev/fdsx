[project]
name = "fdsx"
dynamic = ["version"]
description = "Declarative AI agent workflow execution framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "kenfdev"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<5",
    "pyyaml>=6",
    "typer>=0.9",
    "httpx>=0.27",
    "structlog>=24",
    "uuid-utils>=0.9",
]

[project.urls]
Homepage = "https://github.com/kenfdev/fdsx"
Repository = "https://github.com/kenfdev/fdsx"

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6",
    "pre-commit>=3",
]

[project.scripts]
fdsx = "fdsx.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fdsx = ["examples/workflows/**/*.yaml", "examples/workflows/**/*.txt"]

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = false
pretty = true

[[tool.mypy.overrides]]
module = "fdsx.*"
strict = true
