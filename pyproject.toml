[project]
name = "fdsx"
dynamic = ["version"]
description = "Declarative AI agent workflow execution framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "kenfdev"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<5",
    "pyyaml>=6",
    "typer>=0.9",
    "click>=8",
    "httpx>=0.27",
    "structlog>=24",
    "uuid-utils>=0.9",
    "jsonschema>=4,<5",
]

[project.urls]
Homepage = "https://github.com/kenfdev/fdsx"
Repository = "https://github.com/kenfdev/fdsx"

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6",
    "pre-commit>=3",
    "pip-audit>=2",
]

[project.scripts]
fdsx = "fdsx.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fdsx = ["py.typed", "examples/workflows/**/*.yaml", "examples/workflows/**/*.txt", "examples/workflows/**/*.md", "examples/workflows/**/*.sh", "data/skills/**/*.md"]

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "T20", "SIM", "PTH"]
ignore = ["E501"]  # handled by ruff format
fixable = ["I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/fdsx/display/terminal.py" = ["T20"]
"src/fdsx/core/selector.py" = ["T20"]
"src/fdsx/core/batch.py" = ["T20"]
"src/fdsx/core/engine/batch.py" = ["T20"]
"src/fdsx/core/engine/run.py" = ["T20"]
"src/fdsx/core/engine/resume.py" = ["T20"]
"src/fdsx/core/engine/signals.py" = ["T20"]
"src/fdsx/core/engine/tasks_dir.py" = ["T20"]
"src/fdsx/logging/stream_logger.py" = ["T20"]
"src/fdsx/cli/main.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = true
pretty = true

[tool.uv]
constraint-dependencies = [
    "requests>=2.33.0",  # CVE-2026-25645
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.6",
    "types-jsonschema>=4",
    "types-pyyaml>=6.0.12.20250915",
]

[[tool.mypy.overrides]]
module = "fdsx.*"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
