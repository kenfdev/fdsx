name: publish-fdsx-ui

on:
  push:
    tags:
      - "fdsx-ui-v*"
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: publish-to-npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/fdsx-ui
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/fdsx-ui
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: print npm version
        run: npm --version

      - name: install
        run: npm ci

      - name: audit signatures
        run: npm audit signatures

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build

      - name: verify tarball contents
        run: npm pack --dry-run

      - name: publish
        run: npm publish
