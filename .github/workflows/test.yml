name: test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install uv
        uses: astral-sh/setup-uv@v7
      - name: install dev deps
        run: uv pip install --system -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: upgrade packaging tools
        run: python -m pip install --upgrade 'pip>=26.1' 'setuptools>=83'
      - name: install dev deps
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy src/fdsx
      - name: pytest with coverage
        run: pytest --cov=fdsx --cov-report=xml --cov-fail-under=80
      - name: pip-audit
        run: pip-audit --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-3219  # pygments ReDoS + pip CVE, no fix released yet
