name: test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: install dev deps
        run: uv sync --locked --extra dev
      - name: ruff check
        run: uv run --no-sync ruff check .
      - name: ruff format check
        run: uv run --no-sync ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: install dev deps
        run: uv sync --locked --extra dev
      - name: upgrade packaging tools
        run: uv pip install --upgrade 'pip>=26.1' 'setuptools>=83'
      - name: mypy
        run: uv run --no-sync mypy src/fdsx
      - name: pytest with coverage
        # Auto workers use half the available CPUs via tests/conftest.py.
        run: >-
          uv run --no-sync pytest tests/ -n auto --dist worksteal
          --cov=fdsx --cov-report=xml --cov-fail-under=80
          --junitxml=test-results.xml --durations=20
      - name: upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-python-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
          retention-days: 14
      - name: pip-audit
        run: uv run --no-sync pip-audit --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-3219  # pygments ReDoS + pip CVE, no fix released yet
