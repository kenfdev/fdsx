name: Self-Improve
description: >
  Analyzes recent workflow runs to extract lessons learned
  and improve future performance.
version: "1.0"
start_at: collect_data

states:
  collect_data:
    type: task
    provider: system
    command: ".fdsx/workflows/self-improve/collect_data.sh"
    result_path: $.run_summary
    extract:
      strategy:
        - keyword
      pattern: HAS_RUNS|NO_RUNS
      result_path: $.collect_decision
    next: check_runs

  check_runs:
    type: choice
    choices:
      - variable: $.collect_decision
        operator: equals
        value: HAS_RUNS
        next: write_lessons
    default: update_timestamp_clean

  write_lessons:
    type: task
    profile: generalist
    prompt_file: analyze.md
    result_path: $.lessons
    next: update_timestamp

  update_timestamp:
    type: task
    provider: system
    command: "mv .fdsx/self-improve-last-run.pending .fdsx/self-improve-last-run"
    result_path: $.timestamp_update
    end: true

  update_timestamp_clean:
    type: task
    provider: system
    command: "mv .fdsx/self-improve-last-run.pending .fdsx/self-improve-last-run 2>/dev/null || true; echo 'Analysis complete. No new runs detected.'"
    result_path: $.timestamp_update
    end: true
