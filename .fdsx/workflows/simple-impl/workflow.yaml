name: simple-impl
description: >
  Lightweight pipeline: plan -> test-implement (TDD) -> human gate (approve /
  feedback loop) -> implement -> review -> replan -> fix loop -> finalize with
  squash commit and PR.
version: "1.1"
start_at: plan
max_loop: 10

states:
  # ──────────────────────────────────────────────
  # 1. Planning (Claude)
  # ──────────────────────────────────────────────
  plan:
    type: task
    profile: smarty
    prompt_file: plan.md
    result_path: $.plan_output
    result_file: $.plan_ref
    extract:
      strategy: [keyword, regex]
      pattern: "STEP:1|STEP:2"
      result_path: $.plan_decision
    retry: 2
    next: plan_route

  plan_route:
    type: choice
    choices:
      - variable: $.plan_decision
        operator: equals
        value: "STEP:1"
        next: test_implement
    default: abort_blocked

  # ──────────────────────────────────────────────
  # 2a. Test Implementation (TDD — RED, Claude)
  # ──────────────────────────────────────────────
  test_implement:
    type: task
    profile: smarty
    prompt_file: test-implement.md
    result_path: $.test_implement_output
    result_file: $.test_implement_ref
    extract:
      strategy: [keyword, regex]
      pattern: "STEP:1|STEP:2"
      result_path: $.test_implement_decision
    retry: 2
    next: test_implement_route

  test_implement_route:
    type: choice
    choices:
      - variable: $.test_implement_decision
        operator: equals
        value: "STEP:1"
        next: human_gate
    default: abort_error

  # ──────────────────────────────────────────────
  # 2b. Human gate — approve tests or request feedback
  # ──────────────────────────────────────────────
  human_gate:
    type: wait
    mode: prompt
    message: |
      Test implementation is ready for review.

      Tests written in this iteration: {test_implement_ref}

      To proceed to the implementation phase, select "approve".
      To request changes, write your feedback to .fdsx/feedback.md
      (relative to the repo root), then select "feedback". The feedback
      will be applied to the tests and you will be asked again.
    choices:
      - approve
      - feedback
    result_path: $.gate_decision
    next: human_gate_route

  human_gate_route:
    type: choice
    choices:
      - variable: $.gate_decision
        operator: equals
        value: "approve"
        next: implement
      - variable: $.gate_decision
        operator: equals
        value: "feedback"
        next: apply_feedback
    default: abort_error

  # ──────────────────────────────────────────────
  # 2c. Apply human feedback to the tests, then loop back to gate
  # ──────────────────────────────────────────────
  apply_feedback:
    type: task
    profile: smarty
    prompt_file: apply-feedback.md
    result_path: $.feedback_output
    result_file: $.feedback_ref
    extract:
      strategy: [keyword, regex]
      pattern: "STEP:1|STEP:2"
      result_path: $.apply_feedback_decision
    retry: 2
    next: apply_feedback_route

  apply_feedback_route:
    type: choice
    choices:
      - variable: $.apply_feedback_decision
        operator: equals
        value: "STEP:1"
        next: human_gate
    default: abort_error              # STEP:2 or missing tag → abort

  # ──────────────────────────────────────────────
  # 3. Implementation (TDD — GREEN, Claude)
  # ──────────────────────────────────────────────
  implement:
    type: task
    profile: doer
    prompt_file: implement.md
    result_path: $.implementation_output
    result_file: $.implementation_ref
    extract:
      strategy: [keyword, regex]
      pattern: "STEP:1|STEP:2"
      result_path: $.implement_decision
    retry: 2
    next: implement_route

  implement_route:
    type: choice
    choices:
      - variable: $.implement_decision
        operator: equals
        value: "STEP:1"
        next: review
    default: abort_error

  # ──────────────────────────────────────────────
  # 3. Review (Codex / gpt-5.4)
  # ──────────────────────────────────────────────
  review:
    type: task
    profile: specialist
    prompt_file: review-general.md
    result_path: $.review_output
    result_file: $.review_ref
    extract:
      strategy: [keyword, regex]
      pattern: "APPROVE|REJECT"
      result_path: $.review_decision
    retry: 2
    next: review_route

  review_route:
    type: choice
    choices:
      - variable: $.review_decision
        operator: equals
        value: "APPROVE"
        next: finalize
    default: replan

  # ──────────────────────────────────────────────
  # 4. Replan (Claude — targeted fix plan from review feedback)
  # ──────────────────────────────────────────────
  replan:
    type: task
    profile: smarty
    prompt_file: replan.md
    result_path: $.replan_output
    result_file: $.replan_ref
    extract:
      strategy: [keyword, regex]
      pattern: "STEP:1|STEP:2"
      result_path: $.replan_decision
    retry: 2
    max_iterations: 3
    next: replan_route

  replan_route:
    type: choice
    choices:
      - variable: $.replan_decision
        operator: equals
        value: "STEP:1"
        next: fix
    default: abort_design_issues

  # ──────────────────────────────────────────────
  # 4b. Fix (Claude / opus — apply fixes from replan)
  # ──────────────────────────────────────────────
  fix:
    type: task
    profile: smarty
    prompt_file: fix.md
    result_path: $.fix_output
    result_file: $.fix_ref
    extract:
      strategy: [keyword, regex]
      pattern: "STEP:1|STEP:2|STEP:3"
      result_path: $.fix_decision
    retry: 0
    timeout_seconds: 1200
    next: fix_route

  fix_route:
    type: choice
    choices:
      - variable: $.fix_decision
        operator: equals
        value: "STEP:1"
        next: review
      - variable: $.fix_decision
        operator: equals
        value: "STEP:2"
        next: review
    default: abort_fix_failed

  # ──────────────────────────────────────────────
  # 5. Finalize (Claude — commit, push, PR)
  # ──────────────────────────────────────────────
  finalize:
    type: task
    profile: generalist
    prompt_file: finalize.md
    result_path: $.finalize_output
    retry: 2
    end: true

  # ──────────────────────────────────────────────
  # Terminal states
  # ──────────────────────────────────────────────
  abort_blocked:
    type: task
    provider: system
    command: "echo 'ABORT: Planner identified unresolved blockers. Please provide clarification and re-run.'"
    result_path: $.abort_message
    end: true

  abort_error:
    type: task
    provider: system
    command: "echo 'ABORT: Unrecoverable error during implementation.'"
    result_path: $.abort_message
    end: true

  abort_design_issues:
    type: task
    provider: system
    command: "echo 'ABORT: Fundamental design issues found. Please review feedback and re-run with updated guidance.'"
    result_path: $.abort_message
    end: true

  abort_fix_failed:
    type: task
    provider: system
    command: "echo 'ABORT: Fix agent could not resolve issues. Please review and provide guidance.'"
    result_path: $.abort_message
    end: true
